name: Build and Test

on:
  push:
    branches: [ release ]
  pull_request:
    branches: [ release ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        
    - name: Test imports
      run: |
        python -c "import main"
        python -c "from tool_version_manager import ToolVersionManager"
        python -c "from file_manager import FileManager"
        echo "All imports successful"
        
    - name: Build executable
      run: |
        python build_exe.py
        echo "Build completed"
        
    - name: List files
      run: |
        echo "Release directory:"
        if (Test-Path "release") { Get-ChildItem "release" } else { echo "Release directory not found" }
        echo "Dist directory:"
        if (Test-Path "dist") { Get-ChildItem "dist" } else { echo "Dist directory not found" }
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: IAR-Tool-Build
        path: |
          release/
          dist/
        retention-days: 7