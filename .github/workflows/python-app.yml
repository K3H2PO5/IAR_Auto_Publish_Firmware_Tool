name: Python Application

on:
  push:
    branches: [ release ]
  pull_request:
    branches: [ release ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    
    - name: Test application startup
      run: |
        python -c "import main; print('Application imports successfully')"
    
    - name: Test version manager
      run: |
        python -c "from tool_version_manager import ToolVersionManager; print('Version manager works')"
    
    - name: Test file manager
      run: |
        python -c "from file_manager import FileManager; print('File manager works')"
    
    - name: Build executable
      run: |
        python build_exe.py
        echo "Build completed successfully"
    
    - name: List build artifacts
      run: |
        echo "Contents of release directory:"
        dir release
        echo "Contents of dist directory:"
        dir dist
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: IAR-Firmware-Publish-Tool-${{ github.run_number }}
        path: |
          release/*.exe
          dist/*.exe
        retention-days: 30